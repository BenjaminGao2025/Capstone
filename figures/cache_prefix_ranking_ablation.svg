<rect x="72" y="582" width="1136" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="104" y="616" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#1d4ed8" text-anchor="start">Conclusion</text>
<text x="230" y="606" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#111827" text-anchor="start">The cache-aware feature finds real shared-prefix opportunity, but adding the cache bonus is neutral at best for ranking.</text>
<text x="230" y="630" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#111827" text-anchor="start">The method should be presented as a serving-level TTFT opportunity signal, not as a standalone OOD fix.</text>
